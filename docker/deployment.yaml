
apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-docker
  namespace: yunji

spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-docker

  template:
    metadata:
      labels:
        app: my-docker

    spec:
      containers:
        - name: my-apache2
          image: yunjipark21/yunji:v1
          ports:
            - containerPort: 80
